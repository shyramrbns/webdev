<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shyra - Web Development Projects</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0c10;
      --panel: #1f2833;
      --teal: #66fcf1;
      --teal-2: #45a29e;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg);
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    .bg-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .bg-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(102, 252, 241, .06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(102, 252, 241, .06) 1px, transparent 1px);
      background-size: 48px 48px;
      -webkit-mask-image: radial-gradient(ellipse at 50% 30%, #000 20%, transparent 75%);
      mask-image: radial-gradient(ellipse at 50% 30%, #000 20%, transparent 75%);
      animation: gridMove 24s linear infinite;
    }

    @keyframes gridMove {
      to { background-position: 48px 48px, 48px 48px; }
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: .45;
      animation: float 14s ease-in-out infinite;
    }
    .orb-1 { width: 420px; height: 420px; background: var(--teal); top: -140px; left: -120px; opacity: .22; }
    .orb-2 { width: 480px; height: 480px; background: var(--teal-2); bottom: -180px; right: -140px; opacity: .3; animation-delay: -5s; }
    .orb-3 { width: 260px; height: 260px; background: #7c5cff; top: 45%; left: 55%; opacity: .14; animation-delay: -9s; }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33%      { transform: translate(40px, -30px) scale(1.08); }
      66%      { transform: translate(-30px, 35px) scale(.95); }
    }

    .particle {
      position: absolute;
      bottom: -10px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--teal);
      opacity: 0;
      animation: rise linear infinite;
    }

    @keyframes rise {
      0%   { transform: translateY(0) scale(1); opacity: 0; }
      10%  { opacity: .7; }
      100% { transform: translateY(-105vh) scale(.4); opacity: 0; }
    }

    .page {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 4.5rem 1.25rem 3rem;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: .6rem;
      padding: .45rem 1rem;
      border-radius: 999px;
      border: 1px solid rgba(102, 252, 241, .35);
      background: rgba(102, 252, 241, .07);
      color: var(--teal);
      font-size: .8rem;
      font-weight: 500;
      letter-spacing: .12em;
      text-transform: uppercase;
      backdrop-filter: blur(6px);
    }

    .eyebrow .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 0 0 0 rgba(102, 252, 241, .7);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      70%  { box-shadow: 0 0 0 10px rgba(102, 252, 241, 0); }
      100% { box-shadow: 0 0 0 0 rgba(102, 252, 241, 0); }
    }

    .hero-title {
      font-weight: 800;
      font-size: clamp(2.4rem, 6vw, 4.6rem);
      line-height: 1.1;
      letter-spacing: -.02em;
      background: linear-gradient(100deg, #fff 0%, var(--teal) 35%, var(--teal-2) 55%, #fff 80%);
      background-size: 250% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 7s ease-in-out infinite;
    }

    @keyframes shine {
      0%, 100% { background-position: 0% 50%; }
      50%      { background-position: 100% 50%; }
    }

    .hero-sub {
      max-width: 620px;
      margin-inline: auto;
      color: rgba(255, 255, 255, .72);
      font-weight: 300;
      font-size: 1.1rem;
    }

    .divider {
      width: 90px;
      height: 4px;
      margin: 1.6rem auto 0;
      border-radius: 4px;
      background: linear-gradient(90deg, transparent, var(--teal), transparent);
      animation: grow 1.2s .5s both cubic-bezier(.2, .8, .2, 1);
    }

    @keyframes grow {
      from { width: 0; opacity: 0; }
      to   { width: 90px; opacity: 1; }
    }

    .reveal {
      opacity: 0;
      transform: translateY(28px);
      animation: fadeUp .9s cubic-bezier(.2, .8, .2, 1) forwards;
      animation-delay: calc(var(--i, 0) * 140ms + 100ms);
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    .a-wrap { perspective: 1000px; }

    .a-card {
      --accent: var(--teal);
      --mx: 50%;
      --my: 50%;
      position: relative;
      display: flex;
      flex-direction: column;
      width: 100%;
      min-height: 300px;
      padding: 2rem;
      border-radius: 1.6rem;
      text-decoration: none;
      color: #fff;
      overflow: hidden;
      background: linear-gradient(160deg, rgba(31, 40, 51, .85), rgba(11, 12, 16, .75));
      border: 1px solid rgba(255, 255, 255, .09);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 20px 45px rgba(0, 0, 0, .45);
      transform-style: preserve-3d;
      transition: transform .25s ease, border-color .3s ease, box-shadow .3s ease;
    }

    .a-card--green { --accent: #45a29e; }

    .a-card--soon { cursor: default; }
    .a-card--soon:hover .a-arrow { transform: none; background: transparent; color: var(--accent); }

    .a-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(420px circle at var(--mx) var(--my), color-mix(in srgb, var(--accent) 28%, transparent), transparent 60%);
      opacity: 0;
      transition: opacity .3s ease;
      pointer-events: none;
    }

    .a-card::after {
      content: "";
      position: absolute;
      top: 0;
      left: -80%;
      width: 50%;
      height: 100%;
      background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .12), transparent);
      transform: skewX(-20deg);
      pointer-events: none;
    }

    .a-card:hover,
    .a-card:focus-visible {
      color: #fff;
      border-color: var(--accent);
      box-shadow: 0 25px 60px rgba(0, 0, 0, .55), 0 0 40px color-mix(in srgb, var(--accent) 30%, transparent);
      outline: none;
    }

    .a-card:hover::before,
    .a-card:focus-visible::before { opacity: 1; }

    .a-card:hover::after,
    .a-card:focus-visible::after {
      left: 130%;
      transition: left .9s ease;
    }

    .a-num {
      position: absolute;
      top: .6rem;
      right: 1.4rem;
      font-size: 6rem;
      font-weight: 800;
      line-height: 1;
      color: transparent;
      -webkit-text-stroke: 1.5px color-mix(in srgb, var(--accent) 45%, transparent);
      transition: transform .4s ease, -webkit-text-stroke-color .3s ease;
      user-select: none;
    }

    .a-card:hover .a-num {
      transform: translateY(-6px) scale(1.06);
      -webkit-text-stroke-color: var(--accent);
    }

    .a-icon {
      width: 56px;
      height: 56px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      margin-bottom: 1.4rem;
      font-size: 1.5rem;
      color: #0b0c10;
      background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 55%, #fff));
      box-shadow: 0 8px 22px color-mix(in srgb, var(--accent) 40%, transparent);
      transition: transform .35s cubic-bezier(.3, 1.6, .5, 1);
    }

    .a-card:hover .a-icon { transform: rotate(-8deg) scale(1.1); }

    .a-title {
      font-size: 1.7rem;
      font-weight: 700;
      margin-bottom: .6rem;
      color: var(--accent);
    }

    .a-desc {
      color: rgba(255, 255, 255, .75);
      font-weight: 300;
      margin-bottom: 1.3rem;
    }

    .a-tag {
      display: inline-block;
      padding: .3rem .8rem;
      margin: 0 .35rem .35rem 0;
      border-radius: 999px;
      font-size: .75rem;
      font-weight: 500;
      color: var(--accent);
      border: 1px solid color-mix(in srgb, var(--accent) 50%, transparent);
      background: color-mix(in srgb, var(--accent) 10%, transparent);
    }

    .a-open {
      margin-top: auto;
      padding-top: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 600;
      letter-spacing: .02em;
    }

    .a-arrow {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-size: 1.1rem;
      transition: background .3s ease, color .3s ease, transform .3s ease;
    }

    .a-card:hover .a-arrow {
      background: var(--accent);
      color: #0b0c10;
      transform: translateX(6px);
    }

    .btn-back {
      position: relative;
      overflow: hidden;
      padding: .9rem 2.6rem;
      border-radius: 999px;
      font-weight: 600;
      color: var(--teal);
      background: rgba(102, 252, 241, .06);
      border: 1px solid var(--teal-2);
      transition: color .35s ease, box-shadow .35s ease, transform .25s ease;
      z-index: 0;
    }

    .btn-back::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, var(--teal-2), var(--teal));
      transform: translateX(-101%);
      transition: transform .4s cubic-bezier(.2, .8, .2, 1);
      z-index: -1;
    }

    .btn-back:hover {
      color: #0b0c10;
      transform: translateY(-3px);
      box-shadow: 0 10px 28px rgba(102, 252, 241, .3);
    }

    .btn-back:hover::before { transform: translateX(0); }

    .footer-note {
      color: rgba(255, 255, 255, .4);
      font-size: .85rem;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
      .reveal { opacity: 1; transform: none; }
    }
  </style>
</head>

<body>

  <div class="bg-layer" aria-hidden="true">
    <div class="bg-grid"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div id="particles"></div>
  </div>

  <main class="page">

    <header class="text-center mb-5">
      <div class="reveal" style="--i:0">
        <span class="eyebrow"><span class="dot"></span> Shyra's Web Dev Journey</span>
      </div>
      <h1 class="hero-title mt-4 mb-3 reveal" style="--i:1">Web Development<br>Projects</h1>
      <p class="hero-sub reveal" style="--i:2">
        A collection of my lessons, activities, exercises and academic outputs. Pick an activity to open it.
      </p>
      <div class="divider"></div>
    </header>

    <section class="row g-4 g-lg-5 justify-content-center" id="activityList"></section>

    <div class="text-center mt-5 pt-3 reveal" style="--i:6">
      <a href="https://shyramrbns.github.io/" class="btn btn-back">&larr; Back to Portfolio</a>
      <p class="footer-note mt-4 mb-0">&copy; 2026 Shyra Mae Rubianes</p>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <script>

    var activities = [
      {
        title: "Activity 1",
        description: "Bento layout using HTML and Bootstrap. Covers JavaScript history, containers, grid system and breakpoints.",
        tags: ["HTML", "Bootstrap", "Bento Layout"],
        link: "webdev/BENTO/index.html",
        icon: "&lt;/&gt;",
        color: "teal"
      },
      {
        title: "Activity 2",
        description: "JSON activity. Coming soon, this will be added once it is finished.",
        tags: ["JSON", "Upcoming"],
        link: "",
        soon: true,
        icon: "{ }",
        color: "green"
      }
    ];

    var list = document.getElementById("activityList");
    var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var canHover = window.matchMedia("(hover: hover)").matches;

    activities.forEach(function (a, i) {
      var col = document.createElement("div");
      col.className = "col-12 col-md-6 d-flex a-wrap reveal";
      col.style.setProperty("--i", i + 3);

      var tags = a.tags.map(function (t) {
        return '<span class="a-tag">' + t + '</span>';
      }).join("");

      var num = String(i + 1).padStart(2, "0");

      col.innerHTML =
        '<' + (a.soon ? 'div' : 'a href="' + a.link + '"') + ' class="a-card a-card--' + a.color + (a.soon ? ' a-card--soon' : '') + '">' +
          '<span class="a-num">' + num + '</span>' +
          '<div class="a-icon">' + a.icon + '</div>' +
          '<h3 class="a-title">' + a.title + '</h3>' +
          '<p class="a-desc">' + a.description + '</p>' +
          '<div>' + tags + '</div>' +
          '<div class="a-open"><span>' + (a.soon ? 'Coming Soon' : 'Open Activity') + '</span><span class="a-arrow">' + (a.soon ? '&hellip;' : '&rarr;') + '</span></div>' +
        '</' + (a.soon ? 'div' : 'a') + '>';

      list.appendChild(col);

      var card = col.querySelector(".a-card");

      if (canHover && !reduceMotion && !a.soon) {
        card.addEventListener("mousemove", function (e) {
          var r = card.getBoundingClientRect();
          var x = e.clientX - r.left;
          var y = e.clientY - r.top;
          var rx = ((y / r.height) - 0.5) * -8;
          var ry = ((x / r.width) - 0.5) * 8;
          card.style.setProperty("--mx", x + "px");
          card.style.setProperty("--my", y + "px");
          card.style.transform = "rotateX(" + rx + "deg) rotateY(" + ry + "deg) translateY(-6px)";
        });
        card.addEventListener("mouseleave", function () {
          card.style.transform = "";
        });
      }
    });

    if (!reduceMotion) {
      var box = document.getElementById("particles");
      for (var p = 0; p < 22; p++) {
        var s = document.createElement("span");
        s.className = "particle";
        s.style.left = Math.random() * 100 + "%";
        s.style.animationDuration = (9 + Math.random() * 12) + "s";
        s.style.animationDelay = (-Math.random() * 20) + "s";
        var size = 2 + Math.random() * 4;
        s.style.width = size + "px";
        s.style.height = size + "px";
        box.appendChild(s);
      }
    }
  </script>
</body>

</html>
